<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bologna FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>Bologna FC · Serie A</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    /* Scelta del mese */
    .months { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
    .month { flex-shrink: 0; padding: 6px 13px; border-radius: 16px; border: 1px solid #30363d; background: transparent; color: #8b949e; cursor: pointer; font-size: 0.8rem; text-transform: capitalize; transition: all 0.2s; }
    .month:hover { color: #e6edf3; border-color: #8b949e; }
    .month.active { background: #e6edf3; border-color: #e6edf3; color: #0d1117; font-weight: 600; }
    .month.now::after { content: ' •'; color: #c8102e; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/107.png" alt="Bologna" onerror="this.replaceWith(document.createTextNode('⚽'))"></div>
    <div>
      <h1>Bologna FC 1909</h1>
      <p id="season-label">Tutte le partite di Serie A</p>
    </div>
  </div>
  <div class="refresh-info">
    <div>Prossimo aggiornamento: <span id="countdown">60s</span></div>
    <button class="refresh-btn" onclick="refresh(true)">↻ Aggiorna ora</button>
  </div>
</header>

<nav class="site-nav"></nav>

<main>
  <div class="meta-bar">
    <span id="last-update">—</span>
    <span id="match-count"></span>
  </div>
  <div class="months" id="months"></div>
  <div class="tabs">
    <button class="tab active" onclick="filterMatches('ALL',this)">Tutte</button>
    <button class="tab" onclick="filterMatches('LIVE',this)">🔴 Live</button>
    <button class="tab" onclick="filterMatches('FUTURE',this)">Prossime</button>
    <button class="tab" onclick="filterMatches('PAST',this)">Risultati</button>
    <button class="tab" onclick="filterMatches('BFC',this)">Solo Bologna</button>
  </div>
  <div id="matches-container">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <div id="status-bar" class="loading">Caricamento partite di Serie A...</div>
</main>

<script src="assets/common.js"></script>
<script>
  // Tutte le partite di Serie A, un mese alla volta. Le partite del Bologna sono evidenziate.
  const REFRESH_S = 60;
  const loaded = new Map(); // mese -> { events, lastOk }
  const months = BFC.seasonMonths();
  let selected = '';
  let activeFilter = 'ALL';
  let scrolledToToday = false;

  function monthLabel(m) {
    const d = new Date(+m.slice(0, 4), +m.slice(4) - 1, 1);
    return d.toLocaleDateString('it-IT', { month: 'short' }).replace('.', '') + ' ' + String(d.getFullYear()).slice(2);
  }

  function renderMonths() {
    const now = BFC.ym(new Date());
    document.getElementById('months').innerHTML = months.map(m =>
      `<button class="month ${m === selected ? 'active' : ''} ${m === now ? 'now' : ''}" onclick="selectMonth('${m}')">${monthLabel(m)}</button>`
    ).join('');
    document.querySelector('.month.active')?.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  function selectMonth(m) {
    selected = m;
    scrolledToToday = false;
    renderMonths();
    if (loaded.has(m)) render();
    refresh();
  }

  async function loadMonth(force) {
    const month = selected;
    const had = loaded.get(month);
    if (!had) { BFC.showSkeleton('matches-container', 4); BFC.setStatus('Caricamento partite di Serie A...', 'loading'); }

    const res = await BFC.fetchScoreboard('ita.1', month, force === true);
    if (res.data && !(res.fromCache && had)) {
      const label = BFC.seasonLabel(res.data);
      if (label) document.getElementById('season-label').textContent = `Tutte le partite di Serie A ${label}`;
      const events = (res.data.events || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
      loaded.set(month, { events, lastOk: res.ok ? new Date() : (had?.lastOk || new Date()) });
    }

    const entry = loaded.get(month);
    if (!res.ok && entry) BFC.setStatus(BFC.staleMessage(entry.lastOk, REFRESH_S), 'error');
    else if (!entry) { BFC.setStatus(''); document.getElementById('matches-container').innerHTML = BFC.offlineState(REFRESH_S); document.getElementById('match-count').textContent = ''; }
    else BFC.setStatus('');

    if (month === selected) render();
    else setTimeout(refresh, 0); // l'utente ha cambiato mese durante il caricamento: carica il nuovo appena questo finisce
  }

  function render() {
    const entry = loaded.get(selected);
    if (!entry) return;
    const all = entry.events;
    document.getElementById('last-update').textContent = 'Aggiornato: ' + BFC.timeIt(entry.lastOk);
    const live = all.filter(e => BFC.eventState(e) === 'LIVE').length;
    document.getElementById('match-count').textContent = `${all.length} partite${live ? ` · ${live} in corso` : ''}`;

    let list = all;
    if (activeFilter === 'LIVE') list = all.filter(e => BFC.eventState(e) === 'LIVE');
    else if (activeFilter === 'FUTURE') list = all.filter(e => BFC.eventState(e) === 'FUTURE');
    else if (activeFilter === 'PAST') list = all.filter(e => BFC.eventState(e) === 'PAST').reverse();
    else if (activeFilter === 'BFC') list = all.filter(BFC.hasBologna);

    const container = document.getElementById('matches-container');
    if (!list.length) {
      container.innerHTML = BFC.emptyState('⚽', all.length ? 'Nessuna partita in questa categoria.' : 'Nessuna partita di Serie A in questo mese.');
      return;
    }
    container.innerHTML = BFC.dayGroups(list, { highlight: 'all' });

    // Al primo caricamento del mese in corso, porta la vista a oggi o alla prossima giornata
    if (!scrolledToToday && activeFilter === 'ALL' && selected === BFC.ym(new Date())) {
      scrolledToToday = true;
      const start = new Date(); start.setHours(0, 0, 0, 0);
      const target = [...container.querySelectorAll('.day-group')].find(g => +g.dataset.day >= start.getTime());
      if (target && target !== container.firstElementChild) target.scrollIntoView({ block: 'start' });
    }
  }

  function filterMatches(f, btn) {
    BFC.setActiveTab(btn);
    activeFilter = f;
    render();
  }

  const nowYm = BFC.ym(new Date());
  selected = months.includes(nowYm) ? nowYm : (nowYm < months[0] ? months[0] : months[months.length - 1]);
  const refresh = BFC.autoRefresh(REFRESH_S, loadMonth);
  renderMonths();
  refresh();
</script>
</body>
</html>
