<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bologna FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>Bologna FC · Coppa Italia</title>
  <link rel="stylesheet" href="assets/common.css">
</head>
<body>

<header>
  <div class="header-left">
    <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/107.png" alt="Bologna" onerror="this.replaceWith(document.createTextNode('⚽'))"></div>
    <div>
      <h1>Bologna FC 1909</h1>
      <p id="season-label">Coppa Italia</p>
    </div>
  </div>
  <div class="refresh-info">
    <div>Prossimo aggiornamento: <span id="countdown">60s</span></div>
    <button class="refresh-btn" onclick="refresh(true)">↻ Aggiorna ora</button>
  </div>
</header>

<nav class="site-nav"></nav>

<main>
  <div class="meta-bar">
    <span id="last-update">—</span>
    <span id="match-count"></span>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="filterMatches('FUTURE',this)">Da giocare</button>
    <button class="tab" onclick="filterMatches('PAST',this)">Risultati</button>
    <button class="tab" onclick="filterMatches('BFC',this)">Solo Bologna</button>
  </div>
  <div id="matches-container">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <div id="status-bar" class="loading">Caricamento Coppa Italia...</div>
</main>

<script src="assets/common.js"></script>
<script>
  // Coppa Italia: tutte le partite della stagione. Di default mostra quelle da giocare.
  const REFRESH_S = 60;

  // Nomi dei turni come li scrive ESPN (in inglese, anche con i trattini: "round-of-16"),
  // tradotti quando li riconosciamo. Semifinali e quarti vanno controllati prima della finale.
  const ROUNDS = [
    [/semi ?finals?/, 'Semifinale'], [/quarter ?finals?/, 'Quarti di finale'],
    [/^finals?$/, 'Finale'], [/round of 16|eighth ?finals?/, 'Ottavi di finale'],
    [/round of 32/, 'Sedicesimi di finale'], [/round of 64|first round|preliminary/, 'Turno preliminare'],
  ];
  const roundName = ev => {
    const raw = ev.competitions?.[0]?.notes?.[0]?.headline || ev.season?.slug || '';
    const norm = raw.toLowerCase().replace(/[-_]+/g, ' ').trim();
    if (!norm || /regular|season/.test(norm)) return '';
    const hit = ROUNDS.find(([re]) => re.test(norm));
    return hit ? hit[1] : raw.replace(/[-_]+/g, ' ');
  };

  let events = [];
  let activeFilter = 'FUTURE';
  let lastOk = null;

  async function loadAll(force) {
    if (!lastOk) { BFC.showSkeleton('matches-container'); BFC.setStatus('Caricamento Coppa Italia...', 'loading'); }

    const results = await Promise.all(BFC.seasonMonths().map(m => BFC.fetchScoreboard('ita.coppa_italia', m, force === true)));

    if (results.every(r => r.missing) || results.every(r => !r.data)) {
      if (lastOk) BFC.setStatus(BFC.staleMessage(lastOk, REFRESH_S), 'error');
      else {
        BFC.setStatus('');
        document.getElementById('matches-container').innerHTML = results.every(r => r.missing)
          ? BFC.emptyState('📡', 'ESPN non ha dati sulla Coppa Italia per questa stagione.')
          : BFC.offlineState(REFRESH_S);
      }
      return;
    }

    const map = new Map();
    results.forEach(({ data }) => {
      (data?.events || []).forEach(ev => map.set(ev.id, ev));
      const label = BFC.seasonLabel(data);
      if (label) document.getElementById('season-label').textContent = `Coppa Italia ${label}`;
    });
    events = [...map.values()].sort((a, b) => new Date(a.date) - new Date(b.date));

    const offline = BFC.allFailed(results);
    if (!offline) lastOk = new Date();
    render();
    if (offline) BFC.setStatus(BFC.staleMessage(lastOk, REFRESH_S), 'error');
    else if (results.some(r => !r.ok)) BFC.setStatus('⚠️ Alcuni dati non sono stati aggiornati: riprovo al prossimo giro.', 'error');
    else BFC.setStatus('');
  }

  function render() {
    document.getElementById('last-update').textContent = lastOk ? 'Aggiornato: ' + BFC.timeIt(lastOk) : '—';
    const toPlay = events.filter(e => BFC.eventState(e) !== 'PAST');
    document.getElementById('match-count').textContent = `${toPlay.length} da giocare · ${events.length - toPlay.length} giocate`;

    let list;
    if (activeFilter === 'PAST') list = events.filter(e => BFC.eventState(e) === 'PAST').reverse();
    else if (activeFilter === 'BFC') list = events.filter(BFC.hasBologna);
    else list = toPlay; // le partite in corso stanno in cima, poi le prossime

    const msg = activeFilter === 'FUTURE' ? 'Nessuna partita di Coppa Italia in programma per ora.'
      : activeFilter === 'BFC' ? 'Nessuna partita del Bologna in Coppa Italia in questa stagione.'
      : 'Nessuna partita giocata finora.';
    document.getElementById('matches-container').innerHTML = list.length
      ? BFC.dayGroups(list, { year: true, highlight: 'all', chip: roundName })
      : BFC.emptyState('🏆', msg);
  }

  function filterMatches(f, btn) {
    BFC.setActiveTab(btn);
    activeFilter = f;
    render();
  }

  const refresh = BFC.autoRefresh(REFRESH_S, loadAll);
  refresh();
</script>
</body>
</html>
