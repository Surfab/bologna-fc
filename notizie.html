<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bologna FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>Bologna FC · Notizie</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    .news-list { display: flex; flex-direction: column; gap: 10px; }
    .news { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 12px; color: inherit; text-decoration: none; transition: border-color 0.2s; }
    .news:hover { border-color: #c8102e; }
    .news.no-img { grid-template-columns: 1fr; }
    .news img { width: 112px; height: 75px; object-fit: cover; border-radius: 6px; background: #21262d; }
    .news h2 { font-size: 0.95rem; font-weight: 700; line-height: 1.3; color: #e6edf3; }
    .news p { font-size: 0.8rem; color: #8b949e; line-height: 1.4; margin-top: 4px; }
    .news-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 0.72rem; color: #8b949e; }
    .news-meta .cat { color: #ffd700; background: rgba(255,215,0,0.12); padding: 1px 7px; border-radius: 10px; font-weight: 600; }
    .news-meta .cat.mercato { color: #58a6ff; background: rgba(88,166,255,0.12); }
    .source-note { margin-top: 16px; font-size: 0.72rem; color: #6e7681; line-height: 1.5; }
    .source-note a { color: #8b949e; }
    @media (max-width: 600px) {
      .news { grid-template-columns: 88px 1fr; gap: 10px; padding: 10px; }
      .news img { width: 88px; height: 62px; }
      .news h2 { font-size: 0.88rem; }
      .news p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/107.png" alt="Bologna" onerror="this.replaceWith(document.createTextNode('⚽'))"></div>
    <div>
      <h1>Bologna FC 1909</h1>
      <p>Notizie da TuttoBolognaWeb</p>
    </div>
  </div>
  <div class="refresh-info">
    <button class="refresh-btn" onclick="refresh()">↻ Aggiorna</button>
  </div>
</header>

<nav class="site-nav"></nav>

<main>
  <div class="meta-bar">
    <span id="last-update">Caricamento...</span>
    <span id="news-count"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="news-container" class="news-list">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <p class="source-note">Titoli, sommari e foto dal <a href="https://www.tuttobolognaweb.it/feed" target="_blank" rel="noopener">feed RSS di TuttoBolognaWeb</a>. Tocca una notizia per leggerla sul loro sito. Le notizie si aggiornano ogni 30 minuti circa.</p>
  <div id="status-bar" class="loading">Caricamento notizie...</div>
</main>

<script src="assets/common.js"></script>
<script>
  // Le notizie arrivano dal ramo news-data, aggiornato da .github/workflows/news.yml
  const NEWS_URL = 'https://raw.githubusercontent.com/Surfab/bologna-fc/news-data/news.json';
  const REFRESH_S = 300;
  const STALE_MS = 2 * 60 * 60 * 1000; // oltre 2 ore senza controlli, avvisiamo
  const { esc } = BFC;

  let data = null;
  let activeCat = 'ALL';

  // "5 min fa", "3 ore fa", "ieri", poi la data
  function ago(iso) {
    const d = new Date(iso), s = (Date.now() - d) / 1000;
    if (s < 60) return 'adesso';
    if (s < 3600) return `${Math.floor(s / 60)} min fa`;
    if (s < 86400) { const h = Math.floor(s / 3600); return h === 1 ? '1 ora fa' : `${h} ore fa`; }
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'ieri, ' + BFC.timeIt(d, false);
    return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) + ', ' + BFC.timeIt(d, false);
  }

  // Solo link e immagini del sito: il file arriva da un ramo del repository, ma meglio non fidarsi a occhi chiusi
  const safeUrl = (u, prefixes) => typeof u === 'string' && prefixes.some(p => u.startsWith(p)) ? u : '';
  const LINK_OK = ['https://www.tuttobolognaweb.it/'];
  const IMG_OK = ['https://static.tuttobolognaweb.it/', 'https://www.tuttobolognaweb.it/'];

  async function loadNews() {
    if (!data) BFC.setStatus('Caricamento notizie...', 'loading');
    let fresh = null;
    try {
      // Il parametro evita che il browser riusi una copia vecchia
      const r = await fetch(`${NEWS_URL}?t=${Math.floor(Date.now() / 60000)}`, { cache: 'no-store' });
      if (r.ok) fresh = await r.json();
    } catch (e) { console.error(e); }

    if (!fresh?.items?.length) {
      if (data) BFC.setStatus(`⚠️ Connessione assente. Riprovo tra ${REFRESH_S / 60} minuti.`, 'error');
      else {
        BFC.setStatus('');
        document.getElementById('news-container').innerHTML = BFC.emptyState('📡', `Impossibile caricare le notizie.<br><small>Controlla la connessione internet, riprovo tra ${REFRESH_S / 60} minuti.</small>`);
        document.getElementById('last-update').textContent = 'Non aggiornato';
      }
      return;
    }
    data = fresh;
    render();

    const checked = new Date(data.checkedAt);
    if (Date.now() - checked > STALE_MS) {
      BFC.setStatus(`⚠️ Le notizie potrebbero non essere aggiornate: ultimo controllo ${ago(data.checkedAt)}.`, 'error');
    } else BFC.setStatus('');
  }

  function render() {
    const items = data.items.filter(n => safeUrl(n.link, LINK_OK));
    document.getElementById('last-update').textContent = 'Aggiornate ' + ago(data.checkedAt);

    // Filtri per categoria (News, Mercato...), nell'ordine in cui compaiono
    const cats = [...new Set(items.map(n => n.category).filter(Boolean))];
    if (activeCat !== 'ALL' && !cats.includes(activeCat)) activeCat = 'ALL';
    document.getElementById('tabs').innerHTML = ['ALL', ...cats].map(c =>
      `<button class="tab ${c === activeCat ? 'active' : ''}" data-cat="${esc(c)}">${c === 'ALL' ? 'Tutte' : esc(c)}</button>`).join('');
    document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { activeCat = b.dataset.cat; render(); });

    const list = activeCat === 'ALL' ? items : items.filter(n => n.category === activeCat);
    document.getElementById('news-count').textContent = `${list.length} notizie`;
    document.getElementById('news-container').innerHTML = list.length ? list.map(n => {
      const img = safeUrl(n.image, IMG_OK);
      return `<a class="news ${img ? '' : 'no-img'}" href="${esc(n.link)}" target="_blank" rel="noopener">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('no-img');this.remove()">` : ''}
        <div>
          <h2>${esc(n.title)}</h2>
          ${n.summary ? `<p>${esc(n.summary)}</p>` : ''}
          <div class="news-meta"><span class="cat ${/mercato/i.test(n.category) ? 'mercato' : ''}">${esc(n.category || 'News')}</span><span>${esc(ago(n.date))}</span></div>
        </div>
      </a>`;
    }).join('') : BFC.emptyState('📰', 'Nessuna notizia in questa categoria.');
  }

  const refresh = BFC.autoRefresh(REFRESH_S, loadNews);
  refresh();
</script>
</body>
</html>
