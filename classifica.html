<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bologna FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>Bologna FC · Classifica</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    /* Scheda Bologna */
    .bfc-card { background: linear-gradient(135deg, rgba(200,16,46,0.18), rgba(22,27,34,1) 60%); border: 1px solid #8B1A1A; border-radius: 12px; padding: 18px; margin-bottom: 22px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
    .bfc-pos { text-align: center; min-width: 84px; }
    .bfc-pos .num { font-size: 2.6rem; font-weight: 800; color: #ffd700; line-height: 1; }
    .bfc-pos .lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; }
    .bfc-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .bfc-stat .v { font-size: 1.2rem; font-weight: 700; }
    .bfc-stat .k { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.6px; }
    .bfc-gaps { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
    .gap-chip { background: #21262d; border-radius: 20px; padding: 5px 12px; font-size: 0.8rem; color: #e6edf3; }
    .gap-chip b { color: #ffd700; }

    /* Tabella */
    .table-wrap { background: #161b22; border: 1px solid #21262d; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    thead th { font-size: 0.68rem; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 6px; text-align: center; border-bottom: 1px solid #21262d; background: #11161d; }
    thead th.team-col { text-align: left; }
    tbody td { padding: 9px 6px; text-align: center; border-bottom: 1px solid #1c2128; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #1c2128; }
    td.pos { position: relative; width: 40px; font-weight: 700; color: #8b949e; }
    td.pos::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; border-radius: 0 3px 3px 0; background: var(--zone, transparent); }
    td.team { text-align: left; }
    .team-cell { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .team-cell img { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
    .team-cell span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td.pts { font-weight: 800; color: #e6edf3; }
    td.muted { color: #8b949e; }
    tr.is-bfc { background: rgba(200,16,46,0.16); }
    tr.is-bfc:hover { background: rgba(200,16,46,0.24); }
    tr.is-bfc .team-cell span { color: #ffd700; }
    tr.is-bfc td.pos { color: #ffd700; }

    .form { display: inline-flex; gap: 3px; }
    .form i { width: 17px; height: 17px; border-radius: 4px; font-style: normal; font-size: 0.62rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: #0d1117; }
    .form .V { background: #3fb950; }
    .form .N { background: #8b949e; }
    .form .P { background: #f85149; }
    .form .empty { background: #21262d; }

    .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 0.78rem; color: #8b949e; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    /* Classifica live */
    .live-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: rgba(63,185,80,0.10); border: 1px solid rgba(63,185,80,0.45); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.82rem; }
    .live-bar.on { display: flex; }
    .live-bar .msg { color: #3fb950; font-weight: 600; }
    .live-bar .msg small { display: block; color: #8b949e; font-weight: 400; margin-top: 2px; }
    .seg { display: inline-flex; border: 1px solid #30363d; border-radius: 18px; overflow: hidden; }
    .seg button { background: transparent; border: 0; color: #8b949e; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; }
    .seg button.active { background: #3fb950; color: #0d1117; font-weight: 700; }
    .seg button.active.off { background: #e6edf3; }
    .live-score { flex-shrink: 0; font-style: normal; font-size: 0.68rem; font-weight: 700; color: #3fb950; background: rgba(63,185,80,0.12); border-radius: 8px; padding: 1px 6px; }
    .mv { display: block; font-size: 0.6rem; font-weight: 700; line-height: 1; margin-top: 2px; }
    .mv.up { color: #3fb950; }
    .mv.down { color: #f85149; }
    .bfc-live { grid-column: 1 / -1; color: #3fb950; font-size: 0.85rem; font-weight: 600; }
    .bfc-live small { color: #8b949e; font-weight: 400; }
    .bfc-card.live { border-color: rgba(63,185,80,0.6); }
    .footnote { margin-top: 12px; font-size: 0.72rem; color: #6e7681; line-height: 1.5; }

    .skeleton { height: 38px; margin-bottom: 6px; }

    @media (max-width: 600px) {
      .hide-sm { display: none; }
      table { font-size: 0.8rem; }
      tbody td, thead th { padding-left: 4px; padding-right: 4px; }
      .team-cell img { width: 18px; height: 18px; }
      .team-cell span { max-width: 110px; }
      .bfc-card { grid-template-columns: 1fr; text-align: left; }
      .bfc-pos { display: flex; align-items: baseline; gap: 10px; text-align: left; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/107.png" alt="Bologna" onerror="this.replaceWith(document.createTextNode('⚽'))"></div>
    <div>
      <h1>Bologna FC 1909</h1>
      <p id="season-label">Classifica Serie A</p>
    </div>
  </div>
  <div class="refresh-info">
    <button class="refresh-btn" onclick="refresh()">↻ Aggiorna</button>
  </div>
</header>

<nav class="site-nav"></nav>

<main>
  <div class="meta-bar">
    <span id="last-update">Caricamento...</span>
    <span id="round-info"></span>
  </div>

  <div class="live-bar" id="live-bar">
    <div class="msg"><span class="live-dot"></span><span id="live-msg">Classifica live</span><small id="live-sub"></small></div>
    <div class="seg" role="group" aria-label="Tipo di classifica">
      <button id="btn-live" onclick="setMode('live')">Live</button>
      <button id="btn-official" onclick="setMode('official')">Ufficiale</button>
    </div>
  </div>

  <div id="bfc-card"></div>

  <div id="table-container">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <div class="legend" id="legend"></div>
  <p class="footnote" id="footnote"></p>
  <div id="status-bar" class="loading">Calcolo della classifica...</div>
</main>

<script src="assets/common.js"></script>
<script>
  const LEAGUE = 'ita.1';
  const { API, esc, fetchJSON, setStatus } = BFC;
  const isBologna = name => (name || '').toLowerCase().includes('bologna');

  // Zone europee e retrocessione: prese da ESPN se disponibili, altrimenti queste
  const FALLBACK_ZONES = { 1:'Champions League', 2:'Champions League', 3:'Champions League', 4:'Champions League',
    5:'Europa League', 6:'Europa League', 7:'Conference League qualifying', 18:'Relegated', 19:'Relegated', 20:'Relegated' };
  const ZONE_STYLE = [
    { key: 'champions',  label: 'Champions League',  color: '#4c8dff' },
    { key: 'europa',     label: 'Europa League',     color: '#f0883e' },
    { key: 'conference', label: 'Conference League', color: '#3fb950' },
    { key: 'relegat',    label: 'Retrocessione',     color: '#f85149' },
  ];
  const zoneOf = desc => ZONE_STYLE.find(z => (desc || '').toLowerCase().includes(z.key)) || null;

  let lastOk = null; // ora dell'ultima classifica caricata
  // Ultimi dati caricati: classifica ufficiale, partite finite e partite in corso
  let state = null;
  // 'live' o 'official' scelto dall'utente; null = automatico (live se ci sono partite in corso)
  let userMode = null;
  const LIVE_REFRESH_S = 60, IDLE_REFRESH_S = 120;
  const refreshEvery = () => state?.live.length ? LIVE_REFRESH_S : IDLE_REFRESH_S;

  // Mesi della stagione già iniziati (a giugno e luglio resta la stagione appena finita)
  const playedMonths = () => BFC.seasonMonths().filter(m => m <= BFC.ym(new Date()));

  function newRow(team) {
    return { id: team.id, name: team.shortDisplayName || team.displayName || team.name || '?',
      logo: team.logo || team.logos?.[0]?.href || '', gp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, results: [] };
  }

  // Ordinamento: punti, poi scontri diretti tra le squadre a pari punti, poi differenza reti, gol fatti
  function sortRows(rows, matches) {
    rows.sort((a, b) => b.pts - a.pts);
    const out = [];
    for (let i = 0; i < rows.length; ) {
      let j = i;
      while (j < rows.length && rows[j].pts === rows[i].pts) j++;
      const group = rows.slice(i, j);
      if (group.length > 1) {
        const ids = new Set(group.map(r => r.id));
        const h2h = {};
        group.forEach(r => h2h[r.id] = { pts: 0, gd: 0 });
        matches.forEach(m => {
          if (!ids.has(m.homeId) || !ids.has(m.awayId)) return;
          h2h[m.homeId].gd += m.hs - m.as; h2h[m.awayId].gd += m.as - m.hs;
          if (m.hs > m.as) h2h[m.homeId].pts += 3;
          else if (m.hs < m.as) h2h[m.awayId].pts += 3;
          else { h2h[m.homeId].pts += 1; h2h[m.awayId].pts += 1; }
        });
        group.sort((a, b) =>
          (h2h[b.id].pts - h2h[a.id].pts) || (h2h[b.id].gd - h2h[a.id].gd) ||
          ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf) || a.name.localeCompare(b.name));
      }
      out.push(...group);
      i = j;
    }
    return out;
  }

  async function loadStandings() {
    setStatus('Calcolo della classifica...', 'loading');

    const months = playedMonths();
    const [standingsData, ...boards] = await Promise.all([
      fetchJSON(`${API}/v2/sports/soccer/${LEAGUE}/standings`),
      ...months.map(m => fetchJSON(`${API}/site/v2/sports/soccer/${LEAGUE}/scoreboard?dates=${m}&limit=200`))
    ]);

    // 1. Partite giocate dalla stagione in corso
    const teams = new Map();
    const matches = [];
    const seen = new Set();
    const live = [];
    let seasonName = '';

    boards.forEach(data => {
      if (!data?.events) return;
      if (!seasonName) seasonName = data.leagues?.[0]?.season?.displayName || '';
      data.events.forEach(ev => {
        if (seen.has(ev.id)) return;
        seen.add(ev.id);
        const comp = ev.competitions?.[0];
        const home = comp?.competitors?.find(c => c.homeAway === 'home');
        const away = comp?.competitors?.find(c => c.homeAway === 'away');
        if (!home?.team || !away?.team) return;
        [home, away].forEach(c => { if (!teams.has(c.team.id)) teams.set(c.team.id, newRow(c.team)); });
        const st = ev.status?.type || {};
        const hs = parseInt(home.score, 10), as = parseInt(away.score, 10);
        if (isNaN(hs) || isNaN(as)) return;
        const m = { date: ev.date, homeId: home.team.id, awayId: away.team.id, hs, as };
        // Partita in corso: entra solo nella classifica live, con il risultato del momento
        if (st.state === 'in') live.push({ ...m, clock: ev.status?.displayClock || '' });
        else if (st.state === 'post' && st.completed) matches.push(m);
      });
    });

    matches.sort((a, b) => new Date(a.date) - new Date(b.date));
    matches.forEach(m => {
      const h = teams.get(m.homeId), a = teams.get(m.awayId);
      h.gp++; a.gp++; h.gf += m.hs; h.ga += m.as; a.gf += m.as; a.ga += m.hs;
      const tip = `${h.name} ${m.hs}-${m.as} ${a.name}`;
      if (m.hs > m.as) { h.w++; h.pts += 3; a.l++; h.results.push(['V', tip]); a.results.push(['P', tip]); }
      else if (m.hs < m.as) { a.w++; a.pts += 3; h.l++; h.results.push(['P', tip]); a.results.push(['V', tip]); }
      else { h.d++; a.d++; h.pts++; a.pts++; h.results.push(['N', tip]); a.results.push(['N', tip]); }
    });

    // 2. Dati ufficiali ESPN: zone per posizione e, se più aggiornati, i numeri
    const entries = standingsData?.children?.[0]?.standings?.entries || [];
    const zones = {};
    let espnRows = [];
    entries.forEach(e => {
      const stat = n => e.stats?.find(s => s.name === n)?.value ?? 0;
      const rank = stat('rank');
      if (e.note?.description && rank) zones[rank] = e.note.description;
      if (e.team && !teams.has(e.team.id)) teams.set(e.team.id, newRow(e.team));
      const row = { ...newRow(e.team || {}), rank, gp: stat('gamesPlayed'), w: stat('wins'), d: stat('ties'), l: stat('losses'),
        gf: stat('pointsFor'), ga: stat('pointsAgainst'), pts: stat('points') };
      row.results = teams.get(row.id)?.results || [];
      espnRows.push(row);
    });
    const zoneMap = Object.keys(zones).length ? zones : FALLBACK_ZONES;

    const computedGP = matches.length * 2;
    const espnGP = espnRows.reduce((s, r) => s + r.gp, 0);

    let rows, source;
    if (espnGP > computedGP) {
      rows = espnRows.sort((a, b) => a.rank - b.rank);
      source = 'espn';
    } else {
      rows = sortRows([...teams.values()], matches);
      source = 'calcolata';
    }

    if (!rows.length) {
      if (lastOk) {
        // Teniamo la classifica già mostrata invece di svuotare la pagina
        const wait = refreshEvery();
        setStatus(`⚠️ Connessione assente. Classifica delle ${lastOk.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}, riprovo tra ${wait === 60 ? '1 minuto' : '2 minuti'}.`, 'error');
      } else {
        setStatus('⚠️ Impossibile caricare la classifica. Controlla la connessione e riprova.', 'error');
        document.getElementById('table-container').innerHTML = '';
        document.getElementById('last-update').textContent = 'Non aggiornato';
      }
      return;
    }

    if (seasonName) {
      const yr = seasonName.match(/(\d{4})-(\d{2})/);
      document.getElementById('season-label').textContent = yr ? `Classifica Serie A ${yr[1]}/${yr[2]}` : 'Classifica Serie A';
    }
    lastOk = new Date();
    document.getElementById('last-update').textContent = 'Aggiornato: ' + lastOk.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    state = { rows, matches, live, zoneMap, source, teams };
    render();
    setStatus('', '');
  }

  // Classifica live: le partite in corso contano come se finissero adesso
  function liveRows(official, matches, live) {
    const rows = official.map(r => ({ ...r, results: r.results.slice(), live: null }));
    const byId = new Map(rows.map(r => [r.id, r]));
    // Partite finite per squadra: se la classifica ESPN ne conta di più per entrambe,
    // la partita in corso è già nei suoi numeri e non va contata due volte
    const done = new Map();
    matches.forEach(m => [m.homeId, m.awayId].forEach(id => done.set(id, (done.get(id) || 0) + 1)));
    live.forEach(m => {
      const h = byId.get(m.homeId), a = byId.get(m.awayId);
      if (!h || !a) return;
      const res = (x, y) => x > y ? 'V' : x < y ? 'P' : 'N';
      h.live = { score: `${m.hs}-${m.as}`, vs: a.name, home: true, clock: m.clock, res: res(m.hs, m.as), gain: m.hs > m.as ? 3 : m.hs === m.as ? 1 : 0 };
      a.live = { score: `${m.hs}-${m.as}`, vs: h.name, home: false, clock: m.clock, res: res(m.as, m.hs), gain: m.as > m.hs ? 3 : m.hs === m.as ? 1 : 0 };
      if (h.gp > (done.get(h.id) || 0) && a.gp > (done.get(a.id) || 0)) return;
      h.gp++; a.gp++; h.gf += m.hs; h.ga += m.as; a.gf += m.as; a.ga += m.hs;
      if (m.hs > m.as) { h.w++; h.pts += 3; a.l++; }
      else if (m.hs < m.as) { a.w++; a.pts += 3; h.l++; }
      else { h.d++; a.d++; h.pts++; a.pts++; }
    });
    // Stesso criterio della classifica calcolata, con le partite in corso tra quelle giocate
    return sortRows(rows, [...matches, ...live]);
  }

  function setMode(m) { userMode = m; render(); }

  function render() {
    if (!state) return;
    const { rows: official, matches, live, zoneMap, source } = state;
    const hasLive = live.length > 0;
    const isLive = hasLive && userMode !== 'official';
    const rows = isLive ? liveRows(official, matches, live) : official;
    const officialPos = new Map(official.map((r, i) => [r.id, i + 1]));

    // Barra live: visibile solo quando ci sono partite in corso
    document.getElementById('live-bar').classList.toggle('on', hasLive);
    if (hasLive) {
      const n = live.length;
      document.getElementById('live-msg').textContent = isLive ? 'Classifica live, risultati provvisori' : 'Classifica ufficiale';
      document.getElementById('live-sub').textContent = isLive
        ? `${n === 1 ? '1 partita in corso conta come se finisse' : `${n} partite in corso contano come se finissero`} ora. Aggiornamento ogni minuto.`
        : `${n} ${n === 1 ? 'partita in corso non è' : 'partite in corso non sono'} ancora ${n === 1 ? 'conteggiata' : 'conteggiate'}.`;
      document.getElementById('btn-live').className = isLive ? 'active' : '';
      document.getElementById('btn-official').className = isLive ? '' : 'active off';
    }

    const round = Math.max(...official.map(r => r.gp));
    document.getElementById('round-info').textContent = round
      ? `Dopo ${round} ${round === 1 ? 'giornata' : 'giornate'}${isLive ? ' + partite in corso' : ''}`
      : (isLive ? 'Prima giornata in corso' : 'Campionato non ancora iniziato');

    renderBologna(rows, zoneMap, isLive ? officialPos : null);
    renderTable(rows, zoneMap, isLive ? officialPos : null);
    renderLegend(zoneMap);

    document.getElementById('footnote').textContent = isLive
      ? 'Classifica live: non è ufficiale. Le partite in corso contano con il risultato del momento; le frecce indicano i posti guadagnati o persi rispetto alla classifica ufficiale. A pari punti contano gli scontri diretti, poi la differenza reti e i gol fatti.'
      : (source === 'calcolata'
          ? 'Classifica calcolata dai risultati ufficiali ESPN. A pari punti contano gli scontri diretti, poi la differenza reti e i gol fatti.'
          : 'Classifica ufficiale ESPN.')
        + (hasLive ? ` ${live.length === 1 ? 'C\'è 1 partita' : `Ci sono ${live.length} partite`} in corso: tocca "Live" per vederne l'effetto.` : '');
  }

  // Freccia dei posti guadagnati o persi rispetto alla classifica ufficiale
  function moveHtml(id, pos, officialPos) {
    if (!officialPos) return '';
    const d = (officialPos.get(id) || pos) - pos;
    return d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv down">▼${-d}</span>` : '';
  }

  function formHtml(results) {
    const last = results.slice(-5);
    const cells = last.map(([r, tip]) => `<i class="${r}" title="${esc(tip)}">${r}</i>`);
    while (cells.length < 5) cells.unshift('<i class="empty"></i>');
    return `<span class="form">${cells.join('')}</span>`;
  }

  function renderTable(rows, zoneMap, officialPos) {
    const body = rows.map((r, i) => {
      const pos = i + 1;
      const z = zoneOf(zoneMap[pos]);
      const bfc = isBologna(r.name);
      const gd = r.gf - r.ga;
      const logo = r.logo ? `<img src="${esc(r.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '';
      const liveHtml = r.live ? `<em class="live-score" title="${esc(`${r.live.clock} contro ${r.live.vs}`)}">${esc(r.live.score)}</em>` : '';
      return `<tr class="${bfc ? 'is-bfc' : ''}">
        <td class="pos" style="--zone:${z ? z.color : 'transparent'}">${pos}${moveHtml(r.id, pos, officialPos)}</td>
        <td class="team"><div class="team-cell">${logo}<span>${esc(r.name)}</span>${liveHtml}</div></td>
        <td class="pts">${r.pts}</td>
        <td class="muted">${r.gp}</td>
        <td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td class="muted hide-sm">${r.gf}</td><td class="muted hide-sm">${r.ga}</td>
        <td>${gd > 0 ? '+' + gd : gd}</td>
        <td class="hide-sm">${formHtml(r.results)}</td>
      </tr>`;
    }).join('');

    document.getElementById('table-container').innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr>
          <th title="Posizione">#</th><th class="team-col">Squadra</th>
          <th title="Punti">Pt</th><th title="Giocate">G</th>
          <th title="Vinte">V</th><th title="Pareggiate">N</th><th title="Perse">P</th>
          <th class="hide-sm" title="Gol fatti">GF</th><th class="hide-sm" title="Gol subiti">GS</th>
          <th title="Differenza reti">DR</th><th class="hide-sm">Ultime 5</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table></div>`;
  }

  function renderBologna(rows, zoneMap, officialPos) {
    const idx = rows.findIndex(r => isBologna(r.name));
    const el = document.getElementById('bfc-card');
    if (idx < 0) { el.innerHTML = ''; return; }
    const b = rows[idx], pos = idx + 1;
    const gd = b.gf - b.ga;

    // Distanze: "pari punti" quando la differenza è zero
    const ahead = (n, what) => n === 0 ? `<b>pari punti</b> con ${what}` : `<b>+${n}</b> ${what.replace(/^il /, 'sul ').replace(/^la /, 'sulla ')}`;
    const behind = (n, what) => n === 0 ? `<b>pari punti</b> con ${what}` : `<b>-${n}</b> ${what.replace(/^il /, 'dal ').replace(/^la /, 'dalla ')}`;

    const chips = [];
    if (pos === 1) {
      const second = rows[1];
      chips.push(second ? `In testa, ${ahead(b.pts - second.pts, 'il 2° posto')}` : 'In testa alla classifica');
    } else {
      chips.push(`${behind(rows[0].pts - b.pts, 'la vetta')} (${esc(rows[0].name)})`);
    }
    const uclLast = Math.max(0, ...Object.keys(zoneMap).filter(k => zoneOf(zoneMap[k])?.key === 'champions').map(Number));
    if (uclLast && rows[uclLast - 1] && rows[uclLast]) {
      if (pos <= uclLast) chips.push(`In zona Champions, ${ahead(b.pts - rows[uclLast].pts, `il ${uclLast + 1}° posto`)}`);
      else chips.push(behind(rows[uclLast - 1].pts - b.pts, 'la zona Champions'));
    }
    const relFirst = Math.min(99, ...Object.keys(zoneMap).filter(k => zoneOf(zoneMap[k])?.key === 'relegat').map(Number));
    if (relFirst < 99 && rows[relFirst - 1] && rows[relFirst - 2]) {
      if (pos < relFirst) chips.push(ahead(b.pts - rows[relFirst - 1].pts, 'la zona retrocessione'));
      else chips.push(`In zona retrocessione, ${behind(rows[relFirst - 2].pts - b.pts, 'la salvezza')}`);
    }

    // Partita in corso del Bologna (solo in modalità live)
    let liveLine = '';
    if (b.live) {
      const [hs, as] = b.live.score.split('-');
      const score = b.live.home ? `Bologna ${hs}-${as} ${esc(b.live.vs)}` : `${esc(b.live.vs)} ${hs}-${as} Bologna`;
      const gain = b.live.gain === 3 ? '+3 provvisori' : b.live.gain === 1 ? '+1 provvisorio' : 'nessun punto per ora';
      liveLine = `<div class="bfc-live"><span class="live-dot"></span>Live ${esc(b.live.clock)}: ${score} <small>· ${gain}</small></div>`;
    }
    const move = officialPos ? moveHtml(b.id, pos, officialPos) : '';

    el.innerHTML = `
      <div class="bfc-card ${b.live ? 'live' : ''}">
        ${liveLine}
        <div class="bfc-pos"><div class="num">${pos}°</div><div class="lbl">${officialPos ? 'Posizione live' : 'Posizione'}${move}</div></div>
        <div class="bfc-stats">
          <div class="bfc-stat"><div class="v">${b.pts}</div><div class="k">Punti</div></div>
          <div class="bfc-stat"><div class="v">${b.w}-${b.d}-${b.l}</div><div class="k">V-N-P</div></div>
          <div class="bfc-stat"><div class="v">${b.gf}:${b.ga}</div><div class="k">Gol</div></div>
          <div class="bfc-stat"><div class="v">${gd > 0 ? '+' + gd : gd}</div><div class="k">Diff. reti</div></div>
          <div class="bfc-stat"><div class="v">${formHtml(b.results)}</div><div class="k">Ultime 5</div></div>
        </div>
        <div class="bfc-gaps">${chips.map(c => `<span class="gap-chip">${c}</span>`).join('')}</div>
      </div>`;
  }

  function renderLegend(zoneMap) {
    const present = ZONE_STYLE.filter(z => Object.values(zoneMap).some(d => zoneOf(d)?.key === z.key));
    document.getElementById('legend').innerHTML =
      present.map(z => `<span><i style="background:${z.color}"></i>${z.label}</span>`).join('');
  }

  const refresh = BFC.autoRefresh(refreshEvery, loadStandings);
  refresh();
</script>
</body>
</html>
