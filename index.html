<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bologna FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>Bologna FC — Partite</title>
  <link rel="stylesheet" href="assets/common.css">
</head>
<body>

<header>
  <div class="header-left">
    <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/107.png" alt="Bologna" onerror="this.replaceWith(document.createTextNode('⚽'))"></div>
    <div>
      <h1>Bologna FC 1909</h1>
      <p id="season-label">Serie A</p>
    </div>
  </div>
  <div class="refresh-info">
    <div class="countdown-line"><span class="cd-label">Prossimo aggiornamento: </span><span class="cd-icon" aria-hidden="true">↻ </span><span id="countdown">60s</span></div>
    <button class="refresh-btn" onclick="refresh()">↻ Aggiorna<span class="hide-xs"> ora</span></button>
  </div>
</header>

<nav class="site-nav"></nav>

<main>
  <div class="meta-bar">
    <span id="last-update">—</span>
    <span id="match-count"></span>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="filterMatches('ALL',this)">Tutte</button>
    <button class="tab" onclick="filterMatches('LIVE',this)">🔴 Live</button>
    <button class="tab" onclick="filterMatches('FUTURE',this)">Prossime</button>
    <button class="tab" onclick="filterMatches('PAST',this)">Risultati</button>
  </div>
  <div id="matches-container">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <div id="status-bar" class="loading">Caricamento partite Bologna...</div>
</main>

<script src="assets/common.js"></script>
<script>
  // Partite del Bologna in campionato e in Coppa Italia
  const COMPETITIONS = [
    { slug: 'ita.1',            label: 'Serie A' },
    { slug: 'ita.coppa_italia', label: 'Coppa Italia' },
    // Stagione 2026/27: il Bologna non gioca coppe europee. Se si qualifica, aggiungere qui
    // { slug: 'uefa.champions', label: 'Champions League' }, 'uefa.europa', 'uefa.europa.conf'
  ];
  const REFRESH_S = 60;

  let allEvents = [];
  let activeFilter = 'ALL';
  let lastOk = null;

  // Da due mesi fa a sei mesi avanti
  function monthsToFetch() {
    const now = new Date();
    return Array.from({ length: 9 }, (_, i) => BFC.ym(new Date(now.getFullYear(), now.getMonth() - 2 + i, 1)));
  }

  async function loadMatches() {
    if (!lastOk) { BFC.showSkeleton('matches-container'); BFC.setStatus('Caricamento partite Bologna...', 'loading'); }

    const jobs = [];
    COMPETITIONS.forEach(c => monthsToFetch().forEach(m =>
      jobs.push(BFC.fetchScoreboard(c.slug, m).then(res => ({ ...res, comp: c })))));
    const results = await Promise.all(jobs);

    if (results.filter(r => r.comp.slug === 'ita.1').every(r => !r.data)) {
      // Nessun dato di campionato, nemmeno in cache: la rete non risponde
      if (lastOk) BFC.setStatus(BFC.staleMessage(lastOk, REFRESH_S), 'error');
      else { BFC.setStatus(''); document.getElementById('matches-container').innerHTML = BFC.offlineState(REFRESH_S); }
      return;
    }

    const eventsMap = new Map();
    results.forEach(({ data, comp }) => {
      if (!data?.events) return;
      if (comp.slug === 'ita.1' && BFC.seasonLabel(data)) {
        document.getElementById('season-label').textContent = `Serie A ${BFC.seasonLabel(data)}`;
      }
      data.events.forEach(ev => { if (BFC.hasBologna(ev)) eventsMap.set(ev.id, { ...ev, _comp: comp.label }); });
    });
    allEvents = [...eventsMap.values()].sort((a, b) => new Date(a.date) - new Date(b.date));

    const offline = BFC.allFailed(results);
    if (!offline) lastOk = new Date();
    renderMatches();
    document.getElementById('last-update').textContent = 'Aggiornato: ' + BFC.timeIt(lastOk);
    document.getElementById('match-count').textContent = allEvents.length + ' partite';

    if (allEvents.length === 0) BFC.setStatus('Nessuna partita trovata per Bologna FC', 'error');
    else if (offline) BFC.setStatus(BFC.staleMessage(lastOk, REFRESH_S), 'error');
    else if (results.some(r => !r.ok)) BFC.setStatus('⚠️ Alcuni dati non sono stati aggiornati: riprovo al prossimo giro.', 'error');
    else BFC.setStatus('');
  }

  function renderMatches() {
    const by = st => allEvents.filter(e => BFC.eventState(e) === st);
    let list;
    if (activeFilter === 'LIVE') list = by('LIVE');
    else if (activeFilter === 'FUTURE') list = by('FUTURE');
    else if (activeFilter === 'PAST') list = by('PAST').reverse();
    else list = [...by('LIVE'), ...by('FUTURE'), ...by('PAST').reverse()];

    document.getElementById('matches-container').innerHTML = list.length
      // Etichetta solo per le coppe: in campionato sarebbe ripetitiva
      ? BFC.dayGroups(list, { year: true, highlight: 'home', chip: ev => ev._comp !== 'Serie A' ? ev._comp : '' })
      : BFC.emptyState('⚽', 'Nessuna partita in questa categoria.');
  }

  function filterMatches(f, btn) {
    BFC.setActiveTab(btn);
    activeFilter = f;
    renderMatches();
  }

  const refresh = BFC.autoRefresh(REFRESH_S, loadMatches);
  refresh();
</script>
</body>
</html>
