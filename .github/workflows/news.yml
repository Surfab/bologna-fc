# Ogni 30 minuti scarica le notizie di TuttoBolognaWeb e le pubblica nel ramo "news-data".
# L'app le legge da raw.githubusercontent.com (stesso contenuto, senza blocchi CORS).
# Il ramo news-data contiene un solo commit, sostituito a ogni giro: la cronologia di main resta pulita.
name: Notizie TuttoBolognaWeb

on:
  schedule:
    - cron: '7,37 * * * *'   # minuti 7 e 37: lontano dall'ora piena, quando GitHub è più carico
    - cron: '23 4 * * 1'     # lunedì mattina: riattivazione settimanale (vedi job keepalive)
  workflow_dispatch: {}       # per lanciarla a mano dalla scheda Actions

permissions:
  contents: write
  actions: write   # serve al job keepalive per riattivare l'azione

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  # GitHub mette in pausa le azioni programmate dei repository senza modifiche da 60 giorni.
  # Una volta a settimana riattiviamo questa azione via API, così il conto dei 60 giorni riparte.
  keepalive:
    if: github.event.schedule == '23 4 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Riattiva l'azione delle notizie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/news.yml/enable" && echo "Azione riattivata"

  fetch:
    if: github.event.schedule != '23 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scarica il feed
        run: python3 scripts/fetch_news.py news.json

      - name: Pubblica nel ramo news-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp news.json out/ && cd out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "Notizie aggiornate $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
